<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Pibble and Nibble">
  <!-- Rounded deepslate tile background -->
  <rect width="32" height="32" rx="7" fill="#22262e"/>
  <rect x="1" y="1" width="30" height="30" rx="6" fill="none" stroke="#3a414d" stroke-width="1"/>
  <!-- Pixel block motif: a 2x2 "block" split between the two themes -->
  <g shape-rendering="crispEdges">
    <rect x="7"  y="7"  width="9" height="9" fill="#00CCFF"/>
    <rect x="16" y="7"  width="9" height="9" fill="#E0446A"/>
    <rect x="7"  y="16" width="9" height="9" fill="#E0446A"/>
    <rect x="16" y="16" width="9" height="9" fill="#00CCFF"/>
    <!-- subtle inner highlight for a beveled, blocky feel -->
    <rect x="7"  y="7"  width="9" height="2" fill="#ffffff" opacity="0.28"/>
    <rect x="16" y="7"  width="9" height="2" fill="#ffffff" opacity="0.28"/>
  </g>
</svg>
